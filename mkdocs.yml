site_name: "PI-Guard: LLM Security Guardrail"
site_description: "A Machine-Learning Guardrail for Detecting Prompt Injection and Jailbreak Attacks on LLM Applications"
site_author: "PI-Guard Capstone Team (FPT University)"
site_url: "https://nvtruongops.github.io/pi-guard/"
repo_url: "https://github.com/nvtruongops/pi-guard"
repo_name: "nvtruongops/pi-guard"

docs_dir: "site_docs"
site_dir: "site"

theme:
  name: material
  language: en
  palette:
    # Mode sáng (Default Light)
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Chuyển sang Dark Mode
    # Mode tối (Dark Mode)
    - scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Chuyển sang Light Mode
  features:
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - def_list
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

