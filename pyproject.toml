[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-guard"
version = "0.1.0"
description = "A Machine-Learning Guardrail for Detecting Prompt Injection and Jailbreak Attacks on LLM Applications"
authors = [
    { name = "Nguyen Van Truong", email = "truongnvse182034@fpt.edu.vn" },
    { name = "Nguyen Qui Duc", email = "ducnqse182087@fpt.edu.vn" },
    { name = "Pham Minh Hoang Viet", email = "vietpmhse181851@fpt.edu.vn" },
    { name = "Do Doan Duy Phuong", email = "phuongdddse180235@fpt.edu.vn" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "streamlit>=1.35.0",
    "joblib>=1.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "jupyterlab>=4.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
